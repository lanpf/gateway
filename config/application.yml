spring:
  application:
    name: gateway
  data:
    redis:
      timeout: PT5S
      connect-timeout: PT2S
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        config-request-timeout: 5000
        import-check:
          enabled: false
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      server:
        webflux:
          routes:
            - id: user-auth
              uri: lb://user-auth
              predicates:
                - Path=/api/user-auth/**,/admin/user-auth/**,/oauth2/**,/.well-known/**
              filters:
                # 服务前缀由网关剥离：/api/user-auth/** → /api/**，/admin/user-auth/** → /admin/**
                - RewritePath=/api/user-auth/(?<segment>.*), /api/$\{segment}
                - RewritePath=/admin/user-auth/(?<segment>.*), /admin/$\{segment}

framework:
  lock:
    redis:
      lease-time: PT90S

gateway:
  access:
    operations:
      timeout: PT60S
      max-blocking-time: PT10S
      lease-safety-margin: PT20S
  header:
    # deny-set / deny-remove: 分别禁止普通 set 与普通 remove 操作的 header 名单；
    # 名单匹配忽略大小写（规范化小写），已登记 RequestHeader 一律不能作为普通 set/remove 目标，无需列入
    deny-set: [Host, Content-Length, Transfer-Encoding, Authorization, Cookie, Connection, Keep-Alive, TE, Trailer, Upgrade, Proxy-Authorization, Proxy-Authenticate, Forwarded, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto, Signature, Signature-Input]
    deny-remove: [Host, Content-Length, Transfer-Encoding, Authorization, Cookie, Connection, Keep-Alive, TE, Trailer, Upgrade, Proxy-Authorization, Proxy-Authenticate, Forwarded, X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto, Signature, Signature-Input]
  access-definition:
    endpoints:
      - endpoint-id: GATEWAY.ADMIN
        service-id: gateway
        route-id: gateway-admin
        tags: [admin]
        status: ENABLED
        matchers:
          - { http-method: PUT, path-pattern: /admin/gateway/policies/app }
          - { http-method: PUT, path-pattern: /admin/gateway/policies/client-access }
          - { http-method: PUT, path-pattern: /admin/gateway/policies/client-credential }
          - { http-method: PUT, path-pattern: /admin/gateway/policies/endpoint-access }
          - { http-method: PUT, path-pattern: /admin/gateway/policies/configuration }
          - { http-method: POST, path-pattern: /admin/gateway/snapshot/publish }
          - { http-method: POST, path-pattern: /admin/gateway/snapshot/rollback }
          - { http-method: GET, path-pattern: /admin/gateway/policies/app }
          - { http-method: GET, path-pattern: /admin/gateway/policies/client-access }
          - { http-method: GET, path-pattern: /admin/gateway/policies/endpoint-access }
          - { http-method: GET, path-pattern: /admin/gateway/snapshot }
        access:
          client-verification-requirement: OPTIONAL
          subject-authentication-requirement: REQUIRED
          required-scopes: [admin]
          required-audiences: [gateway]
      - endpoint-id: USER_AUTH.LOGIN_PUBLIC
        service-id: user-auth
        route-id: user-auth
        status: ENABLED
        matchers:
          - { http-method: POST, path-pattern: /api/user-auth/challenges }
          - { http-method: POST, path-pattern: /api/user-auth/login/mobile-otp }
          - { http-method: POST, path-pattern: /api/user-auth/login/refresh }
          - { http-method: POST, path-pattern: /api/user-auth/login/external/proof }
          - { http-method: POST, path-pattern: /api/user-auth/login/external/attempt }
          - { http-method: POST, path-pattern: /api/user-auth/login/external/complete }
          - { http-method: POST, path-pattern: /api/user-auth/login/external/bound-credential }
        access:
          client-verification-requirement: REQUIRED
          subject-authentication-requirement: ANONYMOUS
      - endpoint-id: USER_AUTH.LOGIN_PARTNER_TRUSTED_MOBILE
        service-id: user-auth
        route-id: user-auth
        status: ENABLED
        matchers:
          - { http-method: POST, path-pattern: /api/user-auth/login/partner/trusted-mobile }
        access:
          client-verification-requirement: REQUIRED
          subject-authentication-requirement: ANONYMOUS
      - endpoint-id: USER_AUTH.AUTHENTICATED_API
        service-id: user-auth
        route-id: user-auth
        status: ENABLED
        matchers:
          - { http-method: POST, path-pattern: /api/user-auth/credentials/bind }
          - { http-method: POST, path-pattern: /api/user-auth/logout }
          - { http-method: POST, path-pattern: /api/user-auth/handoffs }
        access:
          client-verification-requirement: REQUIRED
          subject-authentication-requirement: REQUIRED
          required-audiences: [cloud-api]
      - endpoint-id: USER_AUTH.HANDOFF_EXCHANGE
        service-id: user-auth
        route-id: user-auth
        status: ENABLED
        matchers:
          - { http-method: POST, path-pattern: /api/user-auth/handoffs/exchange }
        access:
          client-verification-requirement: REQUIRED
          subject-authentication-requirement: ANONYMOUS
      - endpoint-id: USER_AUTH.BROWSER_SESSION_API
        service-id: user-auth
        route-id: user-auth
        status: ENABLED
        matchers:
          - { http-method: POST, path-pattern: /api/user-auth/browser-sessions/** }
        access:
          client-verification-requirement: REQUIRED
          subject-authentication-requirement: REQUIRED
      - endpoint-id: USER_AUTH.ADMIN
        service-id: user-auth
        route-id: user-auth
        status: ENABLED
        matchers:
          - { http-method: POST, path-pattern: /admin/user-auth/** }
          - { http-method: PUT, path-pattern: /admin/user-auth/** }
        access:
          client-verification-requirement: OPTIONAL
          subject-authentication-requirement: REQUIRED
          required-scopes: [admin]
          required-audiences: [gateway-admin]
      - endpoint-id: USER_AUTH.OAUTH2_PROTOCOL
        service-id: user-auth
        route-id: user-auth
        status: ENABLED
        matchers:
          - { http-method: GET, path-pattern: /oauth2/** }
          - { http-method: POST, path-pattern: /oauth2/** }
          - { http-method: GET, path-pattern: /.well-known/** }
        access:
          client-verification-requirement: OPTIONAL
          subject-authentication-requirement: ANONYMOUS
    apps:
      mini-program:
        status: ENABLED
        platform: WECHAT_MINI_PROGRAM
        allowed-origins: [https://h5.example.com]
      app: { status: ENABLED, platform: APP }
      admin: { status: ENABLED, platform: WEB }
      oauth2-client: { status: ENABLED, platform: SERVER }
    clients:
      DIRECT:
        status: ENABLED
        allowed-app-ids: [mini-program, app]
      MINI_PROGRAM_REVIEW:
        status: ENABLED
        allowed-app-ids: [mini-program]
      PARTNER_A:
        status: ENABLED
        allowed-app-ids: [mini-program]
        credentials:
          active-credential:
            credential-id: partner-a-current
            valid-from: 2026-01-01T00:00:00Z
            expires-at: 2030-01-01T00:00:00Z
            signature-contract: LEGACY_SECRET_TIMESTAMP_BODY_HMAC_SHA256
            secret-ref: partner-a
    policies:
      bundles:
        standard:
          bundle-id: standard
          capabilities:
            timeout: { connect: PT1S, read: PT3S, total: PT5S }
        browser-session:
          bundle-id: browser-session
          capabilities:
            header-apply:
              trustedHeaders: [APP_ID, CLIENT_ID, USER_ID, SESSION_ID, SUBJECT_TYPE]
              credentialForwarding:
                authorizationHeader: STRIP
                cookies: ALLOW_LIST
                allowedCookieNames: [BROWSER_SESSION]
        oauth2-protocol:
          bundle-id: oauth2-protocol
          capabilities:
            header-apply:
              trustedHeaders: [APP_ID, CLIENT_ID]
              credentialForwarding:
                authorizationHeader: PRESERVE
                cookies: STRIP_ALL
      bindings:
        standard-default: { binding-id: standard-default, bundle-id: standard }
        browser-session: { binding-id: browser-session, bundle-id: browser-session, endpoint-id: USER_AUTH.BROWSER_SESSION_API }
        oauth2-protocol: { binding-id: oauth2-protocol, bundle-id: oauth2-protocol, endpoint-id: USER_AUTH.OAUTH2_PROTOCOL }
  security:
    admin-audience: gateway
    access-token:
      format: SELF_CONTAINED
      issuer: http://localhost:8081
      jwt:
        set-uri: http://localhost:8081/oauth2/jwks
      reference:
        introspection-uri: http://localhost:8081/oauth2/introspect
        client-id: gateway-introspection-client
        client-secret: local-gateway-introspection-secret
    request-signature:
      secrets:
        partner-a: local-partner-a-secret

management:
  endpoints:
    web:
      exposure:
        include: health,info
